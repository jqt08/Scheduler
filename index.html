<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Shift Timeline Maker</title><link rel='stylesheet' href='style.css'></head><body><main><header><h1>Shift Timeline Maker</h1><p>Select working days on the calendar. Unselected dates are rest days. Add special shifts, then generate a 24-hour timeline.</p></header><section class='card controls'><div><label>Start date</label><input id='startDate' type='date'></div><div><label>End date</label><input id='endDate' type='date'></div><button id='applyRange'>Apply range</button></section><section class='card'><h2>Add team</h2><div class='controls'><div><label>Team name</label><input id='teamName' placeholder='Team Richmond'></div><div><label>Default start</label><input id='defaultStart' type='time' value='01:00'></div><div><label>Default end</label><input id='defaultEnd' type='time' value='10:00'></div><button id='addTeam'>+ Add team</button></div><div id='teamTabs' class='tabs'></div></section><section class='card'><div class='toolbar'><button id='workMode' class='active'>Working days</button><button id='specialMode'>Special shifts</button><button id='allBtn'>Select entire range</button><button id='weekdaysBtn'>Select Mon–Fri</button><button id='clearBtn'>Clear team</button></div><div id='specialEditor' class='special hidden'><b>Special shift</b><label>Start <input id='specialStart' type='time' value='23:00'></label><label>End <input id='specialEnd' type='time' value='08:00'></label><button id='applySpecial'>Apply to selected dates</button><button id='removeSpecial'>Remove special shift</button></div><div id='months' class='months'></div><div class='legend'><span><i class='work'></i>Working day</span><span><i class='specialColor'></i>Special shift</span><span><i class='rest'></i>Rest day</span></div><p id='status'></p></section><section class='card actions'><button id='generate'>Generate timeline</button><button id='downloadSvg'>Download SVG</button><button id='downloadJson'>Download schedule JSON</button></section><section class='card'><div id='timelineWrap'><svg id='timeline'></svg></div></section></main><script src='app.js'></script></body></html>
